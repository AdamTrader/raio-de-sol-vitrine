<style>
/* ============================================================
   RAIO DE SOL BABY KIDS — painel admin
   Mesmo sistema visual da vitrine (loja.adaoserver.com.br)
   ============================================================ */
:root{
  color-scheme:light;
  --ground:#FFFBF4; --surface:#FFFFFF; --surface-2:#FFF3E2;
  --ink:#4A3B35; --ink-soft:#93827A; --line:#F1E5D6;
  --sun:#FFD243; --sun-deep:#F4B62B; --rose:#FFA4D5; --rose-deep:#F07FBE;
  --sky:#8CD0E7; --sky-deep:#6CB1D2; --gold-1:#F7E181; --gold-2:#BD8031;
  --vermelho:#E0665C; --verde:#3F9E63;
  --maxw:1000px; --radius:20px; --radius-sm:14px;
  --shadow:0 14px 44px -20px rgba(74,59,53,.30);
  --shadow-soft:0 8px 26px -16px rgba(74,59,53,.24);
  --display:"Comfortaa","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Comfortaa","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); line-height:1.55;
  padding-bottom:70px; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--display)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px;border-radius:6px}

/* ---------- Topo ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(255,251,244,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px 20px; display:flex; align-items:center; gap:12px;
}
header .brand-mark{height:40px;width:auto;flex-shrink:0;display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header .brand-text{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1}
header .brand-text span{display:block;font-size:.58rem;letter-spacing:.28em;font-weight:600;color:var(--sky-deep)}
header .subtitulo{margin-left:auto;font-size:.85rem;color:var(--ink-soft);font-weight:600}

/* ---------- Botões ---------- */
.botao{
  border:none; border-radius:999px; padding:.75em 1.2em; font-family:var(--display);
  font-weight:700; font-size:.92rem; background:var(--sky-deep); color:#fff; width:100%;
  transition:transform .15s ease,box-shadow .15s ease; box-shadow:0 8px 20px -10px rgba(108,177,210,.6);
}
.botao:hover{transform:translateY(-1px)}
.botao.secundario{ background:var(--rose); color:#7a2f5c; box-shadow:0 8px 20px -10px rgba(255,164,213,.6); }
.botao.perigo{ background:var(--vermelho); color:#fff; box-shadow:0 8px 20px -10px rgba(224,102,92,.6); }
.botao.pequeno{ width:auto; padding:.5em .85em; font-size:.82rem; border-radius:999px; box-shadow:none; }
a.botao{ display:inline-block; text-decoration:none; text-align:center; }
.erro-msg{ color:var(--vermelho); font-size:.82rem; margin-top:8px; min-height:18px; }

/* ---------- Login ---------- */
.tela-login{ max-width:340px; margin:64px auto; padding:0 16px; text-align:center; }
.cartao-login{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 24px; border:1px solid var(--line); }
.cartao-login h2{ margin:0 0 4px; font-size:1.3rem; color:var(--gold-2); }
.cartao-login p{ font-size:.85rem; color:var(--ink-soft); margin:0 0 18px; }
.campo{ margin-bottom:14px; text-align:left; }
.campo label{ display:block; font-size:.72rem; font-weight:700; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; }
.campo input, .campo select, .campo textarea{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:.65em .8em;
  font-family:var(--body); font-size:.92rem; background:var(--ground); color:var(--ink); outline:none;
}
.campo input:focus, .campo select:focus, .campo textarea:focus{ border-color:var(--sky-deep); }
.campo textarea{ resize:vertical; min-height:70px; }

/* ---------- Painel principal ---------- */
.escondido{ display:none !important; }
.barra-topo{ max-width:var(--maxw); margin:18px auto 0; padding:0 20px; display:flex; justify-content:flex-end; }
.abas{ max-width:var(--maxw); margin:14px auto 6px; padding:0 20px; display:flex; gap:8px; }
.aba{
  border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); padding:.55em 1.1em;
  border-radius:999px; font-family:var(--display); font-weight:700; font-size:.88rem;
}
.aba.ativa{ background:var(--sky-deep); border-color:var(--sky-deep); color:#fff; }

.conteudo{ max-width:var(--maxw); margin:0 auto; padding:0 20px; }
.acoes-topo{ display:flex; justify-content:flex-end; margin-bottom:14px; }

table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-soft); border:1px solid var(--line); }
thead th{ background:var(--surface-2); color:var(--ink); text-align:left; padding:11px 13px; font-size:.76rem; font-family:var(--display); font-weight:700; letter-spacing:.02em; }
tbody td{ padding:11px 13px; font-size:.86rem; border-top:1px solid var(--line); vertical-align:middle; }
tbody tr:hover{ background:var(--surface-2); }
.badge{ display:inline-block; padding:.28em .8em; border-radius:999px; font-size:.72rem; font-weight:700; font-family:var(--display); }
.badge.disponivel{ background:#E6F6EC; color:var(--verde); }
.badge.esgotado{ background:#FBE6E4; color:var(--vermelho); }
.linha-acoes{ display:flex; gap:6px; flex-wrap:wrap; }

.estado{ text-align:center; padding:48px 20px; color:var(--ink-soft); font-size:.9rem; }

/* ---------- Modal produto ---------- */
.fundo-modal{
  position:fixed; inset:0; background:rgba(40,28,36,.5); z-index:70; display:none;
  align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px);
}
.fundo-modal.aberto{ display:flex; }
.modal{ background:var(--surface); border-radius:var(--radius); padding:24px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow); }
.modal h3{ margin:0 0 14px; color:var(--gold-2); font-size:1.2rem; }
.grade-campos{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
.grade-campos .campo.larga{ grid-column:1 / -1; }
.modal-botoes{ display:flex; gap:10px; margin-top:8px; }

/* ---------- Pedidos ---------- */
.pedido-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-soft); border:1px solid var(--line); padding:15px 17px; margin-bottom:12px; }
.pedido-topo{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
.pedido-codigo{ font-family:var(--display); font-weight:800; color:var(--gold-2); font-size:1.05rem; }
.pedido-data{ font-size:.76rem; color:var(--ink-soft); }
.pedido-itens{ font-size:.86rem; margin:8px 0; color:var(--ink); }
.pedido-itens div{ padding:2px 0; }
.pedido-rodape{ display:flex; justify-content:space-between; align-items:center; font-size:.86rem; }
.pedido-total{ font-family:var(--display); font-weight:800; color:var(--gold-2); }

/* ---------- Foto no modal ---------- */
.codigo-info{ font-size:.78rem; color:var(--ink-soft); margin:-8px 0 14px; }
.codigo-info b{ color:var(--ink); font-family:monospace; }
.foto-area{ display:flex; align-items:center; gap:12px; }
.preview-foto, .preview-foto-vazia{ width:72px; height:72px; border-radius:14px; flex:none; }
.preview-foto{ object-fit:cover; border:2px solid var(--sky); }
.preview-foto-vazia{
  background:var(--surface-2); border:2px dashed var(--sky-deep); color:var(--ink-soft);
  font-size:.62rem; text-align:center; display:flex; align-items:center; justify-content:center; padding:4px;
}
.campo-select-novo{ margin-top:6px; }
</style>
</head>

<div id="painelPrincipal" class="escondido">
  <div class="barra-topo">
    <button class="botao secundario pequeno" id="botaoSair">Sair</button>
  </div>

  <div class="abas">
    <button class="aba ativa" data-aba="produtos">Produtos</button>
    <button class="aba" data-aba="pedidos">Pedidos</button>
  </div>

  <div class="conteudo">

    <!-- ABA PRODUTOS -->
    <div id="abaProdutos">
      <div class="acoes-topo">
        <a class="botao secundario pequeno" href="https://script.google.com/macros/s/AKfycbzrJOSBl9QkMA7FQTb2RUoxQ4183yzYtmFmkE4HBRJkYbMfr9PW3NbNXqAnnIT-1dyM/exec" target="_blank" rel="noopener">📷 Cadastrar produto novo (app antigo)</a>
      </div>
      <div id="areaProdutos"><div class="estado">Carregando produtos...</div></div>
    </div>

    <!-- ABA PEDIDOS -->
    <div id="abaPedidos" class="escondido">
      <div id="areaPedidos"><div class="estado">Carregando pedidos...</div></div>
    </div>

  </div>
</div>

<!-- MODAL DE PRODUTO (criar/editar) -->
<div class="fundo-modal" id="fundoModal">
  <div class="modal">
    <h3 id="tituloModal">Editar produto</h3>
    <div class="codigo-info">Código: <b id="codigoAtual">—</b></div>
    <input type="hidden" id="produtoId">
    <input type="hidden" id="produtoCodigo">
    <div class="grade-campos">
      <div class="campo larga">
        <label>Nome</label>
        <input type="text" id="campoNome">
      </div>
      <div class="campo">
        <label>Categoria</label>
        <select id="campoCategoria"></select>
        <input type="text" class="campo-select-novo escondido" id="campoCategoriaNova" placeholder="Nome da categoria nova">
      </div>
      <div class="campo">
        <label>Tamanho</label>
        <select id="campoTamanho"></select>
        <input type="text" class="campo-select-novo escondido" id="campoTamanhoNova" placeholder="Novo tamanho">
      </div>
      <div class="campo">
        <label>Cor</label>
        <input type="text" id="campoCor">
      </div>
      <div class="campo">
        <label>Gênero</label>
        <select id="campoGenero">
          <option value="Menino">Menino</option>
          <option value="Menina">Menina</option>
          <option value="Unissex">Unissex</option>
        </select>
      </div>
      <div class="campo">
        <label>Preço de venda (R$)</label>
        <input type="number" step="0.01" id="campoPreco">
      </div>
      <div class="campo">
        <label>Quantidade em estoque</label>
        <input type="number" step="1" id="campoQuantidade">
      </div>
      <div class="campo larga">
        <label>Descrição</label>
        <textarea id="campoDescricao"></textarea>
      </div>
      <div class="campo larga">
        <label>Foto do produto</label>
        <div class="foto-area">
          <img class="preview-foto" id="previewFoto" src="" alt="Foto do produto" hidden>
          <div class="preview-foto-vazia" id="previewFotoVazio">Sem foto</div>
          <span class="codigo-info" style="margin:0;">Pra trocar a foto, use o cadastro antigo.</span>
        </div>
      </div>
    </div>
    <div class="erro-msg" id="erroModal"></div>
    <div class="modal-botoes">
      <button class="botao secundario" id="botaoCancelarModal">Cancelar</button>
      <button class="botao" id="botaoSalvarModal">Salvar</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  API_BASE: 'https://n8n.adaoserver.com.br/webhook',
};

let ADMIN_SENHA = '';
let TODOS_PRODUTOS = [];

const telaLogin = document.getElementById('telaLogin');
const painelPrincipal = document.getElementById('painelPrincipal');
const erroLogin = document.getElementById('erroLogin');

function cabecalhosAdmin(extra){
  return Object.assign({ 'x-admin-senha': ADMIN_SENHA }, extra || {});
}

async function fazerLogin(){
  const senha = document.getElementById('inputSenha').value.trim();
  erroLogin.textContent = '';
  if(!senha){ erroLogin.textContent = 'Digite a senha.'; return; }
  try{
    const resp = await fetch(`${CONFIG.API_BASE}/admin-login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const dados = await resp.json();
    if(dados && dados.ok){
      ADMIN_SENHA = senha;
      telaLogin.classList.add('escondido');
      painelPrincipal.classList.remove('escondido');
      carregarProdutos();
    } else {
      erroLogin.textContent = 'Senha incorreta.';
    }
  } catch(e){
    erroLogin.textContent = 'Não foi possível conectar. Tente novamente.';
  }
}

document.getElementById('botaoEntrar').addEventListener('click', fazerLogin);
document.getElementById('inputSenha').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') fazerLogin();
});
document.getElementById('botaoSair').addEventListener('click', () => {
  ADMIN_SENHA = '';
  painelPrincipal.classList.add('escondido');
  telaLogin.classList.remove('escondido');
  document.getElementById('inputSenha').value = '';
});

/* ---------- Abas ---------- */
document.querySelectorAll('.aba').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
    btn.classList.add('ativa');
    const aba = btn.dataset.aba;
    document.getElementById('abaProdutos').classList.toggle('escondido', aba !== 'produtos');
    document.getElementById('abaPedidos').classList.toggle('escondido', aba !== 'pedidos');
    if(aba === 'pedidos') carregarPedidos();
  });
});

/* ---------- Produtos ---------- */
function formatarPreco(v){
  return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

async function carregarProdutos(){
  const area = document.getElementById('areaProdutos');
  area.innerHTML = '<div class="estado">Carregando produtos...</div>';
  try{
    const resp = await fetch(`${CONFIG.API_BASE}/admin-produtos`, { headers: cabecalhosAdmin() });
    if(resp.status === 401){ return sessaoExpirada(); }
    const dados = await resp.json();
    // Mais recentes primeiro (a planilha devolve na ordem de cadastro, do mais antigo pro mais novo).
    TODOS_PRODUTOS = (dados.produtos || []).slice().reverse();
    renderizarProdutos();
    popularSelects();
  } catch(e){
    area.innerHTML = '<div class="estado">Não foi possível carregar os produtos agora.</div>';
  }
}

/* ---------- Categoria / Tamanho (menus suspensos) ---------- */
function popularSelects(){
  const categorias = [...new Set(TODOS_PRODUTOS.map(p => p.categoria).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const tamanhos = [...new Set(TODOS_PRODUTOS.map(p => p.tamanho).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  preencherSelect('campoCategoria', categorias, '+ Nova categoria...');
  preencherSelect('campoTamanho', tamanhos, '+ Novo tamanho...');
}

function preencherSelect(id, valores, textoNovo){
  const select = document.getElementById(id);
  const valorAtual = select.value;
  select.innerHTML = '<option value="">Selecione...</option>' +
    valores.map(v => `<option value="${v}">${v}</option>`).join('') +
    `<option value="__novo__">${textoNovo}</option>`;
  if(valorAtual) select.value = valorAtual;
}

function setSelectComValor(idSelect, valor){
  const select = document.getElementById(idSelect);
  const campoNovo = document.getElementById(idSelect + 'Nova');
  const existe = Array.from(select.options).some(o => o.value === valor);
  if(valor && existe){
    select.value = valor;
    campoNovo.classList.add('escondido');
    campoNovo.value = '';
  } else if(valor){
    select.value = '__novo__';
    campoNovo.classList.remove('escondido');
    campoNovo.value = valor;
  } else {
    select.value = '';
    campoNovo.classList.add('escondido');
    campoNovo.value = '';
  }
}

function valorSelecionado(idSelect){
  const select = document.getElementById(idSelect);
  if(select.value === '__novo__'){
    return document.getElementById(idSelect + 'Nova').value.trim();
  }
  return select.value;
}

['campoCategoria', 'campoTamanho'].forEach(id => {
  document.getElementById(id).addEventListener('change', function(){
    document.getElementById(id + 'Nova').classList.toggle('escondido', this.value !== '__novo__');
  });
});

/* ---------- Foto do produto (só visualização — trocar é pelo cadastro antigo) ---------- */
function mostrarFotoAtual(urlExistente){
  const preview = document.getElementById('previewFoto');
  const vazio = document.getElementById('previewFotoVazio');
  if(urlExistente){
    preview.src = urlExistente;
    preview.hidden = false;
    vazio.hidden = true;
  } else {
    preview.src = '';
    preview.hidden = true;
    vazio.hidden = false;
  }
}

function renderizarProdutos(){
  const area = document.getElementById('areaProdutos');
  if(TODOS_PRODUTOS.length === 0){
    area.innerHTML = '<div class="estado">Nenhum produto cadastrado ainda.</div>';
    return;
  }
  let html = '<table><thead><tr><th>Nome</th><th>Tam./Cor</th><th>Preço</th><th>Qtd.</th><th>Status</th><th>Ações</th></tr></thead><tbody>';
  TODOS_PRODUTOS.forEach(p => {
    const esgotado = Number(p.quantidade) <= 0;
    html += `<tr>
      <td>${p.nome || ''}</td>
      <td>${p.tamanho || ''} ${p.cor ? '· ' + p.cor : ''}</td>
      <td>${formatarPreco(p.preco)}</td>
      <td>${p.quantidade}</td>
      <td><span class="badge ${esgotado ? 'esgotado' : 'disponivel'}">${esgotado ? 'Esgotado' : 'Disponível'}</span></td>
      <td>
        <div class="linha-acoes">
          <button class="botao pequeno" data-editar="${p.id}">Editar</button>
          <button class="botao secundario pequeno" data-toggle="${p.id}">${esgotado ? 'Disponível' : 'Esgotado'}</button>
          <button class="botao perigo pequeno" data-excluir="${p.id}">Excluir</button>
        </div>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  area.innerHTML = html;

  area.querySelectorAll('[data-editar]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalEdicao(btn.dataset.editar));
  });
  area.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => alternarDisponibilidade(btn.dataset.toggle));
  });
  area.querySelectorAll('[data-excluir]').forEach(btn => {
    btn.addEventListener('click', () => excluirProduto(btn.dataset.excluir));
  });
}

async function alternarDisponibilidade(id){
  const produto = TODOS_PRODUTOS.find(p => String(p.id) === String(id));
  if(!produto) return;
  const esgotado = Number(produto.quantidade) <= 0;
  let novaQuantidade = 0;
  if(esgotado){
    const resposta = prompt('Quantas unidades chegaram no estoque?', '1');
    if(resposta === null) return;
    novaQuantidade = parseInt(resposta, 10);
    if(isNaN(novaQuantidade) || novaQuantidade <= 0){ alert('Quantidade inválida.'); return; }
  }
  await salvarProduto(Object.assign({}, produto, { quantidade: novaQuantidade }));
}

async function excluirProduto(id){
  const produto = TODOS_PRODUTOS.find(p => String(p.id) === String(id));
  if(!produto) return;
  if(!confirm(`Excluir "${produto.nome}"? Essa ação não pode ser desfeita.`)) return;
  try{
    const resp = await fetch(`${CONFIG.API_BASE}/admin-produto-excluir`, {
      method: 'POST',
      headers: cabecalhosAdmin({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ id })
    });
    if(resp.status === 401){ return sessaoExpirada(); }
    if(!resp.ok){ alert('Não foi possível excluir agora.'); return; }
    await carregarProdutos();
  } catch(e){
    alert('Não foi possível excluir agora.');
  }
}

function abrirModalEdicao(id){
  const p = TODOS_PRODUTOS.find(x => String(x.id) === String(id));
  if(!p) return;
  document.getElementById('tituloModal').textContent = 'Editar produto';
  document.getElementById('produtoId').value = p.id;
  document.getElementById('produtoCodigo').value = p.codigo || '';
  document.getElementById('codigoAtual').textContent = p.codigo || '—';
  document.getElementById('campoNome').value = p.nome || '';
  setSelectComValor('campoCategoria', p.categoria || '');
  setSelectComValor('campoTamanho', p.tamanho || '');
  document.getElementById('campoCor').value = p.cor || '';
  document.getElementById('campoGenero').value = p.genero || 'Unissex';
  document.getElementById('campoPreco').value = p.preco || '';
  document.getElementById('campoQuantidade').value = p.quantidade || 0;
  document.getElementById('campoDescricao').value = p.descricao || '';
  document.getElementById('erroModal').textContent = '';
  mostrarFotoAtual(p.imagemUrl || null);
  document.getElementById('fundoModal').classList.add('aberto');
}

function fecharModal(){
  document.getElementById('fundoModal').classList.remove('aberto');
}

document.getElementById('botaoCancelarModal').addEventListener('click', fecharModal);
document.getElementById('fundoModal').addEventListener('click', (e) => {
  if(e.target.id === 'fundoModal') fecharModal();
});

document.getElementById('botaoSalvarModal').addEventListener('click', async () => {
  const nome = document.getElementById('campoNome').value.trim();
  if(!nome){ document.getElementById('erroModal').textContent = 'Informe o nome do produto.'; return; }
  const categoria = valorSelecionado('campoCategoria');
  const tamanho = valorSelecionado('campoTamanho');
  if(!categoria){ document.getElementById('erroModal').textContent = 'Escolha ou digite uma categoria.'; return; }
  const produto = {
    id: document.getElementById('produtoId').value,
    nome,
    categoria,
    tamanho,
    cor: document.getElementById('campoCor').value.trim(),
    genero: document.getElementById('campoGenero').value,
    preco: parseFloat(document.getElementById('campoPreco').value) || 0,
    quantidade: parseInt(document.getElementById('campoQuantidade').value, 10) || 0,
    descricao: document.getElementById('campoDescricao').value.trim(),
  };
  const ok = await salvarProduto(produto);
  if(ok) fecharModal();
});

async function salvarProduto(produto){
  try{
    const resp = await fetch(`${CONFIG.API_BASE}/admin-produto-salvar`, {
      method: 'POST',
      headers: cabecalhosAdmin({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(produto)
    });
    if(resp.status === 401){ sessaoExpirada(); return false; }
    if(!resp.ok){ document.getElementById('erroModal').textContent = 'Não foi possível salvar agora.'; return false; }
    await carregarProdutos();
    return true;
  } catch(e){
    document.getElementById('erroModal').textContent = 'Não foi possível salvar agora.';
    return false;
  }
}

/* ---------- Pedidos ---------- */
async function carregarPedidos(){
  const area = document.getElementById('areaPedidos');
  area.innerHTML = '<div class="estado">Carregando pedidos...</div>';
  try{
    const resp = await fetch(`${CONFIG.API_BASE}/admin-pedidos`, { headers: cabecalhosAdmin() });
    if(resp.status === 401){ return sessaoExpirada(); }
    const dados = await resp.json();
    renderizarPedidos(dados.pedidos || []);
  } catch(e){
    area.innerHTML = '<div class="estado">Não foi possível carregar os pedidos agora.</div>';
  }
}

function formatarData(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('pt-BR');
  } catch(e){ return iso || ''; }
}

function renderizarPedidos(pedidos){
  const area = document.getElementById('areaPedidos');
  if(pedidos.length === 0){
    area.innerHTML = '<div class="estado">Nenhum pedido registrado ainda.</div>';
    return;
  }
  let html = '';
  pedidos.forEach(ped => {
    const itensHtml = (ped.itens || []).map(it =>
      `<div>• ${it.nome || ''}${it.tamanho ? ' · ' + it.tamanho : ''}${it.cor ? ' · ' + it.cor : ''}</div>`
    ).join('');
    html += `<div class="pedido-card">
      <div class="pedido-topo">
        <div class="pedido-codigo">#${ped.codigo || ''}</div>
        <div class="pedido-data">${formatarData(ped.dataHora)}</div>
      </div>
      <div class="pedido-itens">${itensHtml}</div>
      <div class="pedido-rodape">
        <span class="badge disponivel">${ped.status || 'aguardando'}</span>
        <span class="pedido-total">${formatarPreco(ped.totalEstimado)}</span>
      </div>
    </div>`;
  });
  area.innerHTML = html;
}

function sessaoExpirada(){
  alert('Sua sessão expirou ou a senha mudou. Entre novamente.');
  ADMIN_SENHA = '';
  painelPrincipal.classList.add('escondido');
  telaLogin.classList.remove('escondido');
}
</script>
</body>
</html>
